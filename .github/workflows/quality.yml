name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Build quality image
        env:
          DML_SOURCE_REVISION: ${{ github.sha }}
        run: docker compose build quality

      - name: Run repository gates
        run: |
          docker compose run --rm quality sh -c '
            set -eu
            uv lock --check
            ruff check .
            mypy src
            pytest
            for dataset in datasets/*.jsonl; do
              dml dataset validate "$dataset"
            done
          '
