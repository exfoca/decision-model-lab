[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "decision-model-lab"
version = "0.1.0"
description = "Reproducible laboratory for evaluating decision models."
authors = [{ name = "Orion Impact" }]
readme = "README.md"
keywords = [
  "artificial-intelligence",
  "benchmarking",
  "calibration",
  "decision-models",
  "reproducibility",
]
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
jev-style = [
  "jev-style[torch]==0.3.0",
]
laya = [
  "laya==0.3.20",
]
tinyjev = [
  "tinyjev[torch]==0.1.3",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
dml = "decision_model_lab.cli:app"

[project.urls]
Homepage = "https://www.orion-impact.com/"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_model_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["decision_model_lab"]
